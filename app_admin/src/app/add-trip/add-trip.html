<h2>Add Trip</h2>
<form [formGroup]="addForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="mb-2"><label>Code</label><input class="form-control" formControlName="code"></div>
  <div class="mb-2"><label>Name</label><input class="form-control" formControlName="name"></div>
  <div class="mb-2"><label>Length</label><input class="form-control" formControlName="length"></div>
  <div class="mb-2"><label>Start</label><input class="form-control" type="date" formControlName="start"></div>
  <div class="mb-2"><label>Resort</label><input class="form-control" formControlName="resort"></div>
  <div class="mb-2"><label>Per Person</label><input class="form-control" formControlName="perPerson"></div>
  <div class="mb-2"><label>Image</label><input class="form-control" formControlName="image"></div>
  <div class="mb-2"><label>Description</label><textarea class="form-control" formControlName="description"></textarea></div>
  <button class="btn btn-primary" type="submit" [disabled]="addForm.invalid">Save</button>
</form>
