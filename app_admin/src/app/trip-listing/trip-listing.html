<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="m-0">Trips</h2>
  <a *ngIf="auth.isLoggedIn()" routerLink="/add" class="btn btn-primary">Add Trip</a>
</div>

<p *ngIf="loading">Loading trips...</p>
<p *ngIf="!loading && message">{{ message }}</p>

<div class="row">
  <div class="col-12 col-md-4" *ngFor="let t of trips">
    <app-trip-card [trip]="t">
      <div class="mt-2" *ngIf="auth.isLoggedIn()">
        <a [routerLink]="['/edit', t.code]" class="btn btn-sm btn-outline-secondary">Edit</a>
        <button class="btn btn-sm btn-outline-danger ms-2" (click)="onDelete(t.code)">Delete</button>
      </div>
    </app-trip-card>
  </div>
</div>
