<!-- FILE: app_admin/src/app/trip-card/trip-card.html -->
<div class="card" style="margin-bottom:12px">
  <div class="card-header">{{ trip.name }}</div>

  <!-- Use a template ref (#img) and set a fallback on error -->
  <img
    #img
    [src]="trip.image.startsWith('http') ? trip.image : '/images/' + trip.image"
    (error)="img.src='https://via.placeholder.com/640x360?text=Trip'"
    alt="trip image"
    class="card-img-top"
  />

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} • {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>
    <p class="card-text" [innerHTML]="trip.description"></p>
    <ng-content></ng-content>
  </div>
</div>
